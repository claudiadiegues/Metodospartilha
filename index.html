<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Método de Hondt e Sainte-Laguë</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#1d2330;--mut:#6b7280;--bd:#dcdfe5;--ac:#1f5fbf;--hl:#cfe8d5;--hlt:#14532d}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222c;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#343a48;--ac:#6ea3f5;--hl:#1f4a2f;--hlt:#bfe9cb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input.n{width:130px}input.nm{flex:1;min-width:120px}input.sm{width:80px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--bg);font-weight:600}
td.e{background:var(--hl);color:var(--hlt);font-weight:700}
td .o{font-size:.7rem;opacity:.8;margin-left:4px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.92rem}
.chip b{color:var(--ac)}
.warn{margin-top:10px;color:#b45309;font-size:.9rem}
label{font-size:.92rem}
td:first-child,th:first-child{position:sticky;left:0;z-index:1}
td:first-child{background:var(--card)}
th:first-child{background:var(--bg)}
.act{margin-top:12px}
.row[hidden]{display:none}
@media (max-width:600px){
  main{padding:14px 10px 36px}
  .card{padding:12px}
  th,td{padding:5px 7px;font-size:.85rem}
  input.n{width:100%}
  input.nm{flex:1 1 100%}
  .row label{width:100%}
}
</style>
</head>
<body>
<main>
<h1>Método de Hondt e Método de Sainte-Laguë</h1>
<p class="s">Escolhe o método, insere o número de mandatos e os votos de cada lista. A tabela de divisões é calculada automaticamente.</p>

<div class="card">
  <div class="row">
    <label>Método:
      <select id="method">
        <option value="H">Hondt (1, 2, 3, 4, …)</option>
        <option value="S">Sainte-Laguë (1, 3, 5, 7, …)</option>
        <option value="C">Personalizado (escolho os divisores)</option>
      </select></label>
    <label>Mandatos a distribuir:
      <input id="seats" class="sm" type="number" min="1" max="40" value="7"></label>
  </div>
  <div class="row" id="custRow" hidden>
    <label>Divisores (separa com espaço ou ponto e vírgula; decimais com vírgula):
      <input id="cust" class="nm" value="1; 2; 3; 4; 5; 6; 7"></label>
  </div>
  <div id="inputs"></div>
  <div class="row">
    <button class="p" id="add">+ Adicionar lista</button>
    <button id="clear">Limpar votos</button>
  </div>
</div>

<div class="card">
  <h2 id="title"></h2>
  <p class="s" id="sub"></p>
  <div class="wrap" id="tbl"></div>
  <div class="act"><button class="p" id="hl">Mostrar mandatos</button></div>
  <div id="res"></div>
</div>
</main>

<script>
let showHl=false;
const lists=[{n:"Lista A",v:0},{n:"Lista B",v:0},{n:"Lista C",v:0}];
const $=id=>document.getElementById(id);

function buildInputs(){
  $('inputs').innerHTML='';
  lists.forEach((l,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<input class="nm" value="${l.n}" aria-label="Nome da lista">
      <input class="n" type="number" min="0" value="${l.v||''}" placeholder="Votos" aria-label="Votos">
      <button title="Remover">✕</button>`;
    const [nm,vt,rm]=r.children;
    nm.oninput=()=>{l.n=nm.value;calc()};
    vt.oninput=()=>{l.v=Math.max(0,parseFloat(vt.value)||0);calc()};
    rm.onclick=()=>{if(lists.length>2){lists.splice(i,1);buildInputs();calc()}};
    $('inputs').appendChild(r);
  });
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(x){return x.toLocaleString('pt-PT',{maximumFractionDigits:2})}

function calc(){
  const N=Math.min(40,Math.max(1,parseInt($('seats').value)||1));
  const m=$('method').value;
  $('custRow').hidden=m!=='C';
  let divs=Array.from({length:N},(_,k)=>m==='S'?2*k+1:k+1),err='';
  if(m==='C'){
    const toks=$('cust').value.split(/[;\s]+/).filter(Boolean);
    divs=toks.map(t=>/^\d+([.,]\d+)?$/.test(t)?parseFloat(t.replace(',','.')):NaN);
    if(!divs.length||divs.some(d=>!(d>0))){divs=[];err='⚠ Divisores inválidos. Usa números positivos separados por espaço ou ponto e vírgula (ex.: 1; 1,4; 3; 5).'}
  }
  $('title').textContent=m==='H'?'Método de Hondt':m==='S'?'Método de Sainte-Laguë':'Método personalizado';
  $('sub').style.color=err?'#b45309':'';
  $('sub').textContent=err||(m==='H'?'Divisores: 1, 2, 3, 4, 5, …':m==='S'?'Divisores: 1, 3, 5, 7, 9, … (números ímpares)':'Divisores escolhidos: '+divs.map(fmt).join('; '));

  const q=lists.map((l,i)=>divs.map(d=>({i,v:l.v/d})));
  const all=q.flat().sort((a,b)=>b.v-a.v||a.i-b.i);
  const top=all.slice(0,N).filter(x=>x.v>0);
  const rank=new Map();top.forEach((x,k)=>rank.set(x,k+1));
  const seats=lists.map(()=>0);
  top.forEach(x=>seats[x.i]++);

  let h='<table><tr><th>Divisor</th>'+lists.map(l=>`<th>${esc(l.n)}</th>`).join('')+'</tr>';
  h+='<tr><th>Votos</th>'+lists.map(l=>`<th>${fmt(l.v)}</th>`).join('')+'</tr>';
  divs.forEach((d,k)=>{
    h+=`<tr><td><b>${fmt(d)}</b></td>`;
    lists.forEach((l,i)=>{
      const c=q[i][k],r=rank.get(c);
      h+=`<td class="${showHl&&r?'e':''}">${fmt(c.v)}${showHl&&r?`<span class="o">(${r}º)</span>`:''}</td>`;
    });
    h+='</tr>';
  });
  if(showHl) h+='<tr><th>Mandatos</th>'+seats.map(s=>`<th>${s}</th>`).join('')+'</tr>';
  h+='</table>';
  $('tbl').innerHTML=h;

  let s='';
  if(showHl){
    s='<div class="res">'+lists.map((l,i)=>`<span class="chip">${esc(l.n)}: <b>${seats[i]}</b></span>`).join('')+'</div>';
    if(all[N-1]&&all[N]&&all[N-1].v>0&&all[N-1].v===all[N].v)
      s+='<div class="warn">⚠ Há um empate no último mandato ('+fmt(all[N-1].v)+'). Consulta a regra de desempate aplicável.</div>';
  }
  $('res').innerHTML=s;
  $('hl').textContent=showHl?'Esconder mandatos':'Mostrar mandatos';
}

$('add').onclick=()=>{lists.push({n:'Lista '+String.fromCharCode(65+lists.length%26),v:0});buildInputs();calc()};
$('clear').onclick=()=>{lists.forEach(l=>l.v=0);buildInputs();calc()};
$('seats').oninput=calc;
$('cust').oninput=calc;
$('method').onchange=()=>{showHl=false;calc()};
$('hl').onclick=()=>{showHl=!showHl;calc()};
buildInputs();calc();
</script>
</body>
</html>
